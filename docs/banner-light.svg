<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Proof of Ship — back a builder with $WIF, pay them when they ship">
  <defs>
    <radialGradient id="g" cx="0.88" cy="0.05" r="0.75"><stop offset="0" stop-color="rgba(15,122,76,0.16)"/><stop offset="1" stop-color="#f4f2ec" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(11,14,19,0.10)" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.45" stop-color="#f4f2ec" stop-opacity="1"/><stop offset="1" stop-color="#f4f2ec" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#f4f2ec"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#fade)"/>
  <rect width="1280" height="400" rx="24" fill="url(#g)"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="64" width="44" height="44" rx="11" fill="#0b0e13"/>
    <path d="M84 87l9 9 15-20" stroke="#0f7a4c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="95" font-size="26" font-weight="700" fill="#0b0e13">Proof of Ship</text>
    <text x="72" y="196" font-size="64" font-weight="750" letter-spacing="-2.4" fill="#0b0e13">Back a builder.</text>
    <text x="72" y="268" font-size="64" font-weight="750" letter-spacing="-2.4" fill="#0b0e13">Pay them <tspan fill="#0f7a4c">when they ship.</tspan></text>
    <text x="72" y="330" font-size="21" fill="#454d5a">A $WIF escrow on Robinhood Chain that pays only for real ships</text>
  </g>
  <g transform="translate(930 92)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="278" height="216" rx="18" fill="#fbfaf7" stroke="rgba(11,14,19,0.10)"/>
    <text x="22" y="40" font-size="13" fill="#454d5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">BOUNTY</text>
    <text x="22" y="86" font-size="38" font-weight="750" fill="#0b0e13" letter-spacing="-1">5,000 <tspan font-size="18" fill="#454d5a" font-weight="500">WIF</tspan></text>
    <text x="22" y="124" font-size="15" fill="#454d5a">Ships counted</text>
    <text x="256" y="124" font-size="15" fill="#0b0e13" text-anchor="end" font-weight="650">3 to release</text>
    <rect x="22" y="142" width="234" height="8" rx="4" fill="rgba(11,14,19,0.10)"/>
    <rect x="22" y="142" width="96" height="8" rx="4" fill="#0f7a4c"/>
    <text x="22" y="186" font-size="14" fill="#454d5a">No ships by the deadline?</text>
    <text x="22" y="204" font-size="14" fill="#0b0e13" font-weight="600">Every backer takes it back.</text>
  </g>
</svg>
