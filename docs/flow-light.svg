<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="How Proof of Ship works: 1 Back, anyone locks $WIF behind a project. 2 Ship, the builder ships from public sources. 3 HEY counts the ships and signs the count with EIP-712. 4 Release to the builder at the target, or a refund to each backer after the deadline plus 3 days.">
<style>.n{animation:in .6s ease-out both}@keyframes in{from{opacity:0;transform:translateY(8px)}}.f{animation:flow 1.4s linear infinite}@keyframes flow{from{stroke-dashoffset:20}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="430" rx="14" fill="#F5F6F8"/>
<text x="40" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">HOW IT WORKS</text>
<text x="40" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#535B66">The escrow holds the $WIF. HEY only signs how many ships it counted. The contract does the rest.</text>
<g class="n" style="animation-delay:0.00s">
<rect x="40.0" y="104" width="247.0" height="186" rx="12" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="1"/>
<text x="60.0" y="138" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#4F7A00">01</text>
<text x="60.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0B0E11">Back</text>
<text x="60.0" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">Anyone locks $WIF behind a</text>
<text x="60.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">project with a page on HEY.</text>
<text x="60.0" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">Anyone can add more.</text>
<text x="60.0" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">create · fund</text>
</g>
<g class="n" style="animation-delay:0.12s">
<rect x="331.0" y="104" width="247.0" height="186" rx="12" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="1"/>
<text x="351.0" y="138" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#4F7A00">02</text>
<text x="351.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0B0E11">Ship</text>
<text x="351.0" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">The builder ships: releases,</text>
<text x="351.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">contract deployments, code.</text>
<text x="351.0" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">Each from a public source.</text>
<text x="351.0" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">nothing to apply for</text>
</g>
<g class="n" style="animation-delay:0.24s">
<rect x="622.0" y="104" width="247.0" height="186" rx="12" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="1"/>
<text x="642.0" y="138" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#4F7A00">03</text>
<text x="642.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0B0E11">HEY counts</text>
<text x="642.0" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">HEY counts the ships by its</text>
<text x="642.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">public rule and signs the</text>
<text x="642.0" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">count, not a verdict.</text>
<text x="642.0" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">EIP-712 signed count</text>
</g>
<g class="n" style="animation-delay:0.36s">
<rect x="913.0" y="104" width="247.0" height="186" rx="12" fill="#FFFFFF" stroke="#4F7A00" stroke-width="1.5"/>
<text x="933.0" y="138" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#4F7A00">04</text>
<text x="933.0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0B0E11">Release</text>
<text x="933.0" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">At the target, anyone submits</text>
<text x="933.0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">the count. The builder is</text>
<text x="933.0" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#535B66">paid, minus the burn share.</text>
<text x="933.0" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">claim</text>
</g>
<path class="f" d="M293.0 197 H319.0" fill="none" stroke="#4F7A00" stroke-width="2" stroke-dasharray="5 5"/><path d="M318.0 192 L325.0 197 L318.0 202" fill="none" stroke="#4F7A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="f" d="M584.0 197 H610.0" fill="none" stroke="#4F7A00" stroke-width="2" stroke-dasharray="5 5"/><path d="M609.0 192 L616.0 197 L609.0 202" fill="none" stroke="#4F7A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="f" d="M875.0 197 H901.0" fill="none" stroke="#4F7A00" stroke-width="2" stroke-dasharray="5 5"/><path d="M900.0 192 L907.0 197 L900.0 202" fill="none" stroke="#4F7A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1036.5 296 V340 H171.5 Q163.5 340 163.5 332 V304" fill="none" stroke="#535B66" stroke-width="1.6" stroke-dasharray="3 5"/>
<path d="M158.5 304 L163.5 297 L168.5 304" fill="none" stroke="#535B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="234.0" y="323" width="732" height="34" rx="17" fill="#F5F6F8" stroke="#DDE1E7"/>
<text x="600.0" y="345" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#535B66"><tspan font-weight="700" fill="#0B0E11">Or refund:</tspan> no target met by the deadline plus 3 days, and each backer takes back their own $WIF.</text>
<text x="40" y="408" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">One contract, no owner. Source verified on Sourcify: ShipEscrow on Robinhood Chain (4663).</text>
</svg>
